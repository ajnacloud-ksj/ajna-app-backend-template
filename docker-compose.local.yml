# Local development stack — hot-reload for backend and UI. NOT for production.
# (Production: backend → Lambda from Dockerfile; UI → CloudFront.)
#
# GENERIC + NO Dockerfile.local. Local builds the SAME prod `Dockerfile`
# (FROM ${BASE_IMAGE}), just with:
#   - the ghcr MIRROR of ajna-lambda-base as the base (GitHub-token auth, no AWS creds),
#   - the Lambda CMD replaced by a uvicorn hot-reload command,
#   - src/ + local_dev.py bind-mounted over the baked copies so edits reload instantly.
# One Dockerfile, no drift, works for any app's Dockerfile. dev.sh injects
# ports / AJNA_SDK_PATH / UI_DIR / LOCAL_PLUGINS_DIR. Do NOT run `docker compose`
# directly — use ./dev.sh.

services:
  # ── Backend: the prod Dockerfile, run as uvicorn (hot-reload) instead of Lambda ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev                     # the multi-stage dev stage: uvicorn hot-reload
      args:
        # Local pulls the base from the ghcr mirror; SAME image+tag as prod (ECR) — the
        # single SDK-version lever. dev.sh reads THIS value for the ghcr login.
        # Keep it at or above the cockpit's DEFAULT_BASE_IMAGE_TAG (what a new app deploys
        # on); src/app.py needs >= 1.53.1 for AuthHandlers.auth_routes().
        # THE ONE SDK VERSION SOURCE in this repo: the SDK fleet bump edits this line. ci/test.sh
        # (the CI test job) reads the SDK version from it, and dev.sh reads the image from it.
        # SDK 4 is token only: no IbexDB key anywhere (see .env.example). A dev build tag
        # (py312-X.Y.Z.devN) is accepted: it is the PEP 440 version CodeArtifact holds.
        BASE_IMAGE: ghcr.io/ajnacloud-ksj/ajna-lambda-base:py312-4.7.1
    # The dev stage's uvicorn --reload, after one step for local sign-in: when dev.sh mounts an
    # ajna-cloud-bricks clone (AJNA_LOCAL_SIGNIN=keycloak), install it (--no-deps, no index), so
    # that the SDK finds the `oidc` login brick that verifies the local Keycloak tokens.
    command:
      - sh
      - -c
      - |
        if [ -f /opt/ajna-cloud-bricks/pyproject.toml ]; then
          rm -rf /tmp/bricks && mkdir -p /tmp/bricks &&
          cp -r /opt/ajna-cloud-bricks/pyproject.toml /opt/ajna-cloud-bricks/README.md /opt/ajna-cloud-bricks/ajna_cloud_bricks /opt/ajna-cloud-bricks/bricks /tmp/bricks/ &&
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+local PIP_CONFIG_FILE=/dev/null pip install --quiet --no-deps --no-build-isolation --no-index /tmp/bricks ||
          { echo "could not install ajna-cloud-bricks from /opt/ajna-cloud-bricks" >&2; exit 1; }
        fi
        exec python -m uvicorn local_dev:app --host 0.0.0.0 --port 8000 --reload --reload-dir /var/task/src
    # The local issuer host (dev.sh sets it with the Keycloak kit on) reaches the kit on the host.
    extra_hosts:
      - "${AJNA_KEYCLOAK_HOST:-keycloak.invalid}:host-gateway"
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
    volumes:
      # Hot-reload: bind-mount over the Dockerfile's baked COPY so edits reflect immediately.
      - ./src:/var/task/src:ro
      - ./local_dev.py:/var/task/local_dev.py:ro
      # AWS creds: local talks to the REAL shared dev Cognito pool (true parity). Each dev
      # needs their own scoped creds in ~/.aws. IbexDB/S3/DynamoDB still run fully local.
      - ~/.aws:/root/.aws:ro
      # Local sign-in (dev.sh): the local CA bundle, and the ajna-cloud-bricks clone (read only).
      - ./.dev/certs:/certs:ro
      - ${AJNA_BRICKS_DIR:-./.dev/no-bricks}:/opt/ajna-cloud-bricks:ro
      # Tenant-plugins repo bind-mounted for hot-reloaded local dev (dev.sh sets LOCAL_PLUGINS_DIR).
      - ${LOCAL_PLUGINS_DIR:-./local-plugins}:/app/local-plugins:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous grace for a cold first build (new deps like pyarrow/duckdb can be slow).
      start_period: 120s

  # ── UI (Vite + React) — the ${PROJECT_NAME}-ui repo, cloned as a sibling by dev.sh ──
  ui:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${PORT_UI:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: "http://localhost:${PORT_BACKEND:-8000}/v1"
    volumes:
      - ${UI_DIR:-../ui}:/app
      - ui_node_modules:/app/node_modules
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ui_node_modules:
