# Local development stack — hot-reload for backend and UI. NOT for production.
# (Production: backend → Lambda from Dockerfile; UI → CloudFront.)
#
# GENERIC + NO Dockerfile.local. Local builds the SAME prod `Dockerfile`
# (FROM ${BASE_IMAGE}), just with:
#   - the ghcr MIRROR of ajna-lambda-base as the base (GitHub-token auth, no AWS creds),
#   - the Lambda CMD replaced by a uvicorn hot-reload command,
#   - src/ + local_dev.py bind-mounted over the baked copies so edits reload instantly.
# One Dockerfile, no drift, works for any app's Dockerfile. dev.sh injects
# ports / AJNA_SDK_PATH / UI_DIR / LOCAL_PLUGINS_DIR. Do NOT run `docker compose`
# directly — use ./dev.sh.

services:
  # ── Backend: the prod Dockerfile, run as uvicorn (hot-reload) instead of Lambda ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev                     # the multi-stage dev stage: uvicorn hot-reload
      args:
        # Local pulls the base from the ghcr mirror; SAME image+tag as prod (ECR) — the
        # single SDK-version lever. dev.sh reads THIS value for the ghcr login.
        BASE_IMAGE: ghcr.io/ajnacloud-ksj/ajna-lambda-base:py312-1.30.5
    # The dev stage's CMD already runs uvicorn --reload; no entrypoint/command override needed.
    ports:
      - "${PORT_BACKEND:-8000}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
    volumes:
      # Hot-reload: bind-mount over the Dockerfile's baked COPY so edits reflect immediately.
      - ./src:/var/task/src:ro
      - ./local_dev.py:/var/task/local_dev.py:ro
      # AWS creds: local talks to the REAL shared dev Cognito pool (true parity). Each dev
      # needs their own scoped creds in ~/.aws. IbexDB/S3/DynamoDB still run fully local.
      - ~/.aws:/root/.aws:ro
      # Tenant-plugins repo bind-mounted for hot-reloaded local dev (dev.sh sets LOCAL_PLUGINS_DIR).
      - ${LOCAL_PLUGINS_DIR:-./local-plugins}:/var/task/local-plugins:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      # Generous grace for a cold first build (new deps like pyarrow/duckdb can be slow).
      start_period: 120s

  # ── UI (Vite + React) — the ${PROJECT_NAME}-ui repo, cloned as a sibling by dev.sh ──
  ui:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${PORT_UI:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: "http://localhost:${PORT_BACKEND:-8000}/v1"
    volumes:
      - ${UI_DIR:-../ui}:/app
      - ui_node_modules:/app/node_modules
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ui_node_modules:
