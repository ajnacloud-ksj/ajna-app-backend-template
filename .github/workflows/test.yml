name: Tests

# Runs ci/test.sh (the backend pytest suite) on every pull request into the app's working
# branches. THE FLEET REFERENCE: every app generated from this template gets this file, and
# existing apps copy it (first: plant-manager-backend#236).
#
# PRIVATE REPOS ONLY. The job runs only when the repository is private (`if:` below), so it never
# runs in this public template repository itself:
#   - a self-hosted (CodeBuild) runner must never take a public repo's jobs, and the CodeBuild
#     runner and CodeArtifact read lists in ajna-app-infra hold private repos only;
#   - a public repo cannot use the private codebuild-guard action
#     (ajna-github-workflows README, "Your own jobs").
# Generated apps are private, so in an app the job runs with no edit.
#
# ADVISORY CHECK. The org is on GitHub Free: branch protection / required status checks are not
# available for private repos. A red run does not block a merge by itself; reviewers must not
# merge on red.
#
# RUNNER (ajna-app-infra #1037, gha_runner.py). The job runs on this repo's CodeBuild-hosted
# runner project `ajna-gha-runner-dev-<repo>` (AWS account 808527335982, ap-south-1) when the
# repo variable CI_ON_CODEBUILD is 'true' (set by the ghrunner-dev stack): one ephemeral build
# per job, ARM Amazon Linux 2023 standard 3.0, `instance-size:small` (the suite runs in seconds,
# in one process). No Docker: the runner project is unprivileged.
#
# CODEARTIFACT, AND ONLY CODEARTIFACT, FOR ajna-cloud. The suite needs the private base SDK
# `ajna-cloud`, which is NOT on public PyPI and must never come from it (dependency confusion).
# This repo's runner role may read the CodeArtifact repository ajna/ajna-pypi and nothing else
# (ghRunnerCodeArtifactReadRepos, ajna-app-infra). The FIRST step, before the checkout, is the
# only step that uses the runner credentials: it gets a 15-minute read token and passes the
# index URL, masked, as a step output to the test step only. ci/test.sh installs ajna-cloud from
# that index with --no-deps, unsets the URL, and fails unless ajna-cloud came from the
# CodeArtifact host, is installed in its own venv, and has the version of the SDK source below.
# No other index is ever given for it. On a GitHub-hosted runner (CI_ON_CODEBUILD not 'true')
# there are no credentials: the job fails at the first step on purpose.
#
# ONE SDK VERSION SOURCE. No SDK version is written in this file. ci/test.sh reads it from
# BASE_IMAGE in docker-compose.local.yml (`ajna-lambda-base:py312-X.Y.Z`), the one place in this
# repo that the SDK fleet bump edits.
#
# NO RUNNER CREDENTIALS IN THE OTHER STEPS. Every other `run:` step runs in a shell started
# under `env -u` for both container credential variables (job `defaults.run.shell`), and the job
# sets AWS_EC2_METADATA_DISABLED=true. The dummy `testing` keys keep boto3 offline.
#
# NO GITHUB CACHE ON THE CODEBUILD RUNNER (ajna-app-infra #1107): no actions/cache, no
# setup-python cache. pyenv's Python 3.12 from the image.
#
# SAME-REPO CODE ONLY. The job runs only when the pull request's head is in this repository: a
# fork pull request never reaches the self-hosted runner (the codebuild-guard step also fails
# closed).
on:
  pull_request:
    branches: [integration-develop, develop, integration-main, main]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a PR cancels that PR's older run. A dispatch run has its own group (run_id), so
# it is never cancelled or queued (ajna-app-infra#1264). On the CodeBuild runner nothing is
# cancelled: a stopped runner build posts a FAILED "Build stopped" commit status (#1037), so
# there a newer run replaces only a PENDING one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ vars.CI_ON_CODEBUILD != 'true' }}

jobs:
  tests:
    # Private repos only (see PRIVATE REPOS ONLY), and same-repo code only (SAME-REPO CODE ONLY).
    if: >-
      github.event.repository.private &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_ON_CODEBUILD == 'true' && fromJSON(format('["codebuild-ajna-gha-runner-dev-{0}-{1}-{2}","image:arm-3.0","instance-size:small"]', github.event.repository.name, github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 20
    # NO RUNNER CREDENTIALS (top of the file); the CodeArtifact step overrides this on purpose.
    defaults:
      run:
        shell: env -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI -u AWS_CONTAINER_CREDENTIALS_FULL_URI bash --noprofile --norc -eo pipefail {0}
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      CA_DOMAIN: ajna
      CA_DOMAIN_OWNER: "808527335982"
      CA_REPO: ajna-pypi
      CA_REGION: ap-south-1
    steps:
      # No-op on a GitHub-hosted runner; fails closed for a fork pull request on CodeBuild.
      - uses: ajnacloud-ksj/ajna-github-workflows/.github/actions/codebuild-guard@d946f95c269cea0379b76bfb5e874b6bf9d23b6e

      - name: CodeArtifact index (the only step with runner credentials)
        id: ca
        # Before the checkout: no code from the repository runs with the credentials.
        # AWS_EC2_METADATA_DISABLED does not stop the container credentials endpoint.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          if [ -z "${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}" ]; then
            echo "::error::No runner credentials: this job needs the CodeBuild runner (CI_ON_CODEBUILD=true) to read ajna-cloud from CodeArtifact"
            exit 1
          fi
          token="$(aws codeartifact get-authorization-token --domain "$CA_DOMAIN" --domain-owner "$CA_DOMAIN_OWNER" \
            --region "$CA_REGION" --duration-seconds 900 --query authorizationToken --output text)"
          echo "::add-mask::$token"
          endpoint="$(aws codeartifact get-repository-endpoint --domain "$CA_DOMAIN" --domain-owner "$CA_DOMAIN_OWNER" \
            --repository "$CA_REPO" --format pypi --region "$CA_REGION" --query repositoryEndpoint --output text)"
          url="https://aws:${token}@${endpoint#https://}simple/"
          echo "::add-mask::$url"
          echo "index_url=$url" >> "$GITHUB_OUTPUT"
          echo "CodeArtifact index: ${endpoint}simple/ (token masked, 15 minutes)"

      - uses: actions/checkout@v4

      - name: Runner credentials are stripped
        run: |
          test -z "${AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:-}"
          test -z "${AWS_CONTAINER_CREDENTIALS_FULL_URI:-}"
          test "${AWS_EC2_METADATA_DISABLED:-}" = "true"
          echo creds-stripped

      - name: Python 3.12 (CodeBuild image, pyenv)
        # The ARM standard 3.0 image names the exact 3.12 version in PYTHON_312_VERSION.
        run: |
          if [ -z "${PYTHON_312_VERSION:-}" ]; then
            echo "::error::PYTHON_312_VERSION is not set on this runner image"
            exit 1
          fi
          pyenv global "$PYTHON_312_VERSION"
          echo "$(pyenv prefix "$PYTHON_312_VERSION")/bin" >> "$GITHUB_PATH"
          echo "PYTHON_312_VERSION=$PYTHON_312_VERSION arch=$(uname -m)"

      - name: ci/test.sh
        env:
          CA_INDEX_URL: ${{ steps.ca.outputs.index_url }}
          # Dummy AWS settings: the tests must never reach a real account.
          AWS_DEFAULT_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          python --version
          ci/test.sh
