name: Deploy Backend

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: ''
        type: choice
        options: ['', 'dev', 'prod']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: ${{ (inputs.environment != '' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
    uses: ajnacloud-ksj/ajna-github-workflows/.github/workflows/reusable-lambda-v2.yml@main
    with:
      aws-region: ${{ vars.AWS_REGION }}
      ecr-repository: {{app-name}}-backend
      lambda-function-name: ${{ vars.LAMBDA_FUNCTION_NAME }}
      lambda-role-arn: ${{ vars.LAMBDA_ROLE_ARN }}
      codeartifact-account: ${{ vars.CODEARTIFACT_ACCOUNT }}
      codeartifact-region: ${{ vars.CODEARTIFACT_REGION }}
      memory-size: ${{ vars.LAMBDA_MEMORY_SIZE && fromJSON(vars.LAMBDA_MEMORY_SIZE) || 512 }}
      timeout: ${{ vars.LAMBDA_TIMEOUT && fromJSON(vars.LAMBDA_TIMEOUT) || 300 }}
      environment-variables: >-
        ENVIRONMENT=${{ vars.APP_ENVIRONMENT }},
        IBEX_API_URL=https://smartlink.ajna.cloud/ibexdb,
        TENANT_ID={{tenant-id}},
        DB_NAMESPACE=default,
        LOG_LEVEL=INFO,
        MASK_SENSITIVE_DATA=true,
        AUTH_MODE=cognito,
        COGNITO_REGION=${{ vars.AWS_REGION }},
        COGNITO_USER_POOL_ID=${{ vars.COGNITO_USER_POOL_ID }},
        COGNITO_CLIENT_ID=${{ vars.COGNITO_CLIENT_ID }},
        APP_PREFIX={{app-name}},
        FEATURE_ITEMS_CRUD=true,
        IBEX_AUDIT_ENABLED=true,
        IBEX_RBAC_ENABLED=true,
        COCKPIT_API_URL=${{ vars.COCKPIT_API_URL }},
        CORS_ALLOWED_ORIGINS=https://${{ vars.S3_PATH }}
    secrets: inherit
