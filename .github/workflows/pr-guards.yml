########################################################################################################
# PR guards — the two mechanical checks that make releases automatic.
#
#   * Conventional PR title  -> drives the SemVer bump (with squash-merge, the title IS the commit)
#   * Exactly one type label -> drives the auto-generated release notes (.github/release.yml)
#
# Both are hard-fail because both are one-click fixes that produce release artifacts.
# Issue linking (Closes #N) is deliberately NOT enforced — the boards track PRs directly and the
# release notes come from labels, so nothing breaks without it. Link issues when the PR closes one.
#
# Untrusted input (title, labels) is only ever read from the API into files — never interpolated
# into run:.
#
# WHY THE CURRENT STATE, NOT THE EVENT PAYLOAD (ajna-app-infra#1037). Runs of one PR queue instead
# of cancelling each other (see `concurrency`), so an older run can finish after a newer event. Its
# payload would then judge an OLDER title or label set. So the first step reads the PR's current
# title and labels (GET /repos/{repo}/pulls/{n}, GITHUB_TOKEN with pull-requests: read), and both
# checks judge that. A read that fails (HTTP error, empty or unparseable body) fails the guard.
#
# WHY ONE JOB (#307). This was two jobs, which reads better in the checks UI and cost two full billed
# minutes to run two `grep`s: Actions rounds EVERY JOB up to a minute, and these do no checkout and
# make one small API read, so both billed minutes were pure rounding — across ~50 repos, every PR event.
# One job with two steps bills one. `if: always()` keeps the property that actually mattered about
# separate jobs: you still see BOTH failures in one run, instead of fixing the title, pushing, and
# only then learning the label is missing.
#
# WHY NO `synchronize` (#307). It re-ran both checks on every push to every PR branch, and neither
# input can change on a push — a title edit fires `edited`, a label change fires `labeled`/`unlabeled`.
# All it bought was re-billing the same answer on every commit of a review cycle.
#
# WHY CANARY REPOS SKIP IT. The platform canary generates throwaway `canary<digits>-*` repos from the
# app templates (196 of them in 2026-10, 715 billed minutes) and tears them down. Its promotion PRs
# are opened and merged by the cockpit, which reads no check result (ajna-cockpit-backend canary.py),
# so a guard there bills a minute and protects nothing. A skipped job bills nothing.
# The resident app `canaryresident-*` is NOT skipped: it is a real app on the monthly release train,
# so it keeps its guards. GitHub expressions have no regex, hence the explicit `canaryresident` term.
#
#
# RUNNER (ajna-app-infra#1037). When the repo's Actions variable CI_ON_CODEBUILD is 'true', the job
# runs on the repo's CodeBuild-hosted runner `ajna-gha-runner-dev-<repo>` (ARM, 2 vCPU, logs-only
# role; ajna-app-infra gha_runner.py). Otherwise, and in every public repo, it runs on
# ubuntu-latest. Delete the variable to move a repo back. The run shell drops the build's
# container credentials (`env -u`), with the same bash flags as GitHub's default shell.
#
# MANAGED FILE — the canonical copy is ajna-app-infra/managed_workflows.py. The daily
# board-maintenance run reports a repo whose copy differs; scripts/fanout_workflow_prs.py opens
# the pull requests that bring it back. Change it there.
########################################################################################################
name: pr guards

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled]

# `edited` + `labeled` arrive in bursts while a PR is being set up. One run at a time per PR: a newer
# event replaces a PENDING run (its job was never queued, so no runner starts) but never cancels a
# RUNNING one. WHY NOT cancel-in-progress (ajna-app-infra#1037): a cancelled job's CodeBuild runner
# build is STOPPED, and CodeBuild then posts "Build stopped" as a FAILED commit status on the PR,
# although the runner projects have reportBuildStatus=False (fan-out, 2026-10-31). GitHub's
# rollup (the merge box) counts the LATEST run per check name, and queued runs finish in order.
concurrency:
  group: pr-guards-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Read only: contents for the checkout-free job, pull-requests to read the PR's current state.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-guards:
    name: PR guards
    # Skipped in the canary's throwaway repos. On the CodeBuild runner: same-repo pull requests only.
    if: ${{ (!startsWith(github.event.repository.name, 'canary') || startsWith(github.event.repository.name, 'canaryresident')) && (vars.CI_ON_CODEBUILD != 'true' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.CI_ON_CODEBUILD == 'true' && fromJSON(format('["codebuild-ajna-gha-runner-dev-{0}-{1}-{2}","image:arm-3.0","instance-size:small"]', github.event.repository.name, github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    defaults:
      run:
        shell: env -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI -u AWS_CONTAINER_CREDENTIALS_FULL_URI bash -e {0}
    steps:
      - name: Read the PR's current title and labels
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -f "$RUNNER_TEMP/pr-title" "$RUNNER_TEMP/pr-labels"
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tmp = os.environ["RUNNER_TEMP"]
          url = "%s/repos/%s/pulls/%s" % (os.environ["API_URL"], os.environ["REPO"], os.environ["NUMBER"])
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  status, pr = resp.status, json.loads(resp.read())
              title, labels = pr["title"], [label["name"] for label in pr["labels"]]
              if status != 200 or not isinstance(title, str) or not title.strip():
                  raise ValueError("no title (HTTP %s)" % status)
              if not all(isinstance(name, str) for name in labels):
                  raise ValueError("a label without a name")
          except Exception as exc:
              print("::error::Could not read this PR's current title and labels: %r" % (exc,))
              sys.exit(1)
          with open(os.path.join(tmp, "pr-title"), "w") as f:
              f.write(title)
          with open(os.path.join(tmp, "pr-labels"), "w") as f:
              f.write(" ".join(labels))
          PY

      - name: Title follows Conventional Commits
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/pr-title" ]; then
            echo "::error::The PR's current title could not be read (see the first step)."
            exit 1
          fi
          TITLE=$(cat "$RUNNER_TEMP/pr-title")
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|release|revert)(\([^)]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(api): add batch export' — it drives the version bump."
            exit 1
          fi

      - name: PR carries one of feature/bug/tech-debt/docs/chore
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/pr-labels" ]; then
            echo "::error::The PR's current labels could not be read (see the first step)."
            exit 1
          fi
          LABELS=$(cat "$RUNNER_TEMP/pr-labels")
          count=0
          for l in $LABELS; do
            case "$l" in feature|bug|tech-debt|docs|chore) count=$((count+1));; esac
          done
          if [ "$count" -eq 1 ]; then
            echo "ok: $LABELS"
          else
            echo "::error::Add exactly one type label (feature / bug / tech-debt / docs / chore) — it drives the release notes. Found: $count"
            exit 1
          fi
