########################################################################################################
# PR guards — the two mechanical checks that make releases automatic.
#
#   * Conventional PR title  -> drives the SemVer bump (with squash-merge, the title IS the commit)
#   * Exactly one type label -> drives the auto-generated release notes (.github/release.yml)
#
# Both are hard-fail because both are one-click fixes that produce release artifacts.
# Issue linking (Closes #N) is deliberately NOT enforced — the boards track PRs directly and the
# release notes come from labels, so nothing breaks without it. Link issues when the PR closes one.
#
# Untrusted input (title, labels) is only ever read via env vars — never interpolated into run:.
#
# WHY ONE JOB (#307). This was two jobs, which reads better in the checks UI and cost two full billed
# minutes to run two `grep`s: Actions rounds EVERY JOB up to a minute, and these do no checkout and
# touch no network, so both billed minutes were pure rounding — across ~50 repos, every PR event.
# One job with two steps bills one. `if: always()` keeps the property that actually mattered about
# separate jobs: you still see BOTH failures in one run, instead of fixing the title, pushing, and
# only then learning the label is missing.
#
# WHY NO `synchronize` (#307). It re-ran both checks on every push to every PR branch, and neither
# input can change on a push — a title edit fires `edited`, a label change fires `labeled`/`unlabeled`.
# All it bought was re-billing the same answer on every commit of a review cycle.
#
# WHY CANARY REPOS SKIP IT. The platform canary generates throwaway `canary*` repos from the app
# templates (196 of them in 2026-10, 715 billed minutes) and tears them down. Its promotion PRs are
# opened and merged by the cockpit, which reads no check result (ajna-cockpit-backend canary.py), so
# a guard there bills a minute and protects nothing. A skipped job bills nothing.
#
# MANAGED FILE — distributed by ajna-app-infra/scripts/ensure_pr_guards.py. Local edits are reverted
# on the next daily board-maintenance run; change it there.
########################################################################################################
name: pr guards

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled]

# `edited` + `labeled` arrive in bursts while a PR is being set up; only the last state matters.
concurrency:
  group: pr-guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Both checks read only the event payload; the token needs nothing beyond read.
permissions:
  contents: read

jobs:
  pr-guards:
    name: PR guards
    if: ${{ !startsWith(github.event.repository.name, 'canary') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Title follows Conventional Commits
        if: always()
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|release|revert)(\([^)]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(api): add batch export' — it drives the version bump."
            exit 1
          fi

      - name: PR carries one of feature/bug/tech-debt/docs/chore
        if: always()
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          count=0
          for l in $LABELS; do
            case "$l" in feature|bug|tech-debt|docs|chore) count=$((count+1));; esac
          done
          if [ "$count" -eq 1 ]; then
            echo "ok: $LABELS"
          else
            echo "::error::Add exactly one type label (feature / bug / tech-debt / docs / chore) — it drives the release notes. Found: $count"
            exit 1
          fi
